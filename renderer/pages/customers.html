<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none';">
  <meta charset="UTF-8" />
  <title>العملاء</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" data-i18n="app.brand">نقطة البيع</div>
      <nav class="nav-links">
        <a href="../index.html" data-i18n="nav.pos">الكاشير</a><a href="quick-cashier.html" data-setting="quickCashier" data-i18n="nav.quickCashier">الكاشير السريع</a>
        <a href="tables.html" data-business="restaurant" data-i18n="nav.tables">الطاولات</a>
        <a href="shift.html" data-i18n="nav.cashSession">الصندوق</a>
        <a href="returns.html" data-roles="admin,manager" data-i18n="nav.returns">مرتجعات</a>
        <a href="products.html" data-roles="admin,manager" data-i18n="nav.products">المنتجات</a>
        <a href="bundles.html" data-roles="admin,manager" data-i18n="nav.bundles">العروض</a>
        <a href="inventory.html" data-roles="admin,manager" data-i18n="nav.inventory">المخزون</a>
        <a href="customers.html" class="active" data-roles="admin,manager" data-i18n="nav.customers">العملاء</a>
        <a href="suppliers.html" data-roles="admin,manager" data-i18n="nav.suppliers">الموردون والشراء</a>
        <a href="reports.html" data-roles="admin,manager" data-i18n="nav.reports">التقارير</a><a href="accounting.html" data-roles="admin" data-i18n="nav.accounting">المحاسبة</a>
        <a href="audit.html" data-roles="admin" data-i18n="nav.audit">سجل التدقيق</a>
        <a href="payroll.html" data-roles="admin" data-i18n="nav.payroll">الرواتب</a>
        <a href="users.html" data-roles="admin" data-i18n="nav.users">المستخدمون</a>
        <a href="settings.html" data-roles="admin" data-i18n="nav.settings">الإعدادات</a>
      </nav>
      <div class="topbar-right">
        <select id="langSwitcher" class="lang-switcher" title="اللغة / Dil / Language">
          <option value="ar">AR</option>
          <option value="tr">TR</option>
          <option value="en">EN</option>
        </select>
        <div class="branch-name" id="branchName">—</div>
        <div class="user-info">
          <span id="currentUserName"></span>
          <span id="currentUserRoleBadge" class="role-badge"></span>
          <button id="logoutBtn" class="btn btn-secondary btn-sm" data-i18n="common.logout">خروج</button>
        </div>
      </div>
    </header>

    <div class="products-page">
      <div class="page-header">
        <h1>العملاء</h1>
        <button id="addCustomerBtn" class="btn btn-primary">+ عميل جديد</button>
      </div>

      <div class="filters-row">
        <input id="searchInput" type="text" placeholder="ابحث بالاسم أو الهاتف..." />
      </div>

      <table class="products-table">
        <thead>
            <tr><th>الاسم</th><th>الهاتف</th><th>نقاط الولاء</th><th>الرصيد المستحق (دين)</th><th>رصيد المتجر</th><th></th></tr>
        </thead>
        <tbody id="customersTableBody"></tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none">لا يوجد عملاء بعد.</div>
    </div>
  </div>

  <div id="ledgerModal" class="modal-overlay hidden"><div class="modal"><h2 id="ledgerTitle">كشف حساب العميل</h2><div id="ledgerBalances"></div><div id="ledgerRows" class="breakdown-list"></div><div class="modal-actions"><button id="receivePaymentBtn" class="btn btn-primary">تسجيل تسديد</button><button id="closeLedgerBtn" class="btn btn-secondary">إغلاق</button></div></div></div>
  <div id="paymentModal" class="modal-overlay hidden"><div class="modal"><h2>تسديد دين</h2><form id="debtPaymentForm"><div class="form-field"><label>المبلغ</label><input id="debtPaymentAmount" type="text" inputmode="numeric" min="0.01" step="0.01" required /></div><div class="form-field"><label>طريقة التسديد</label><select id="debtPaymentMethod"><option value="cash">نقدي</option><option value="card">بطاقة / تحويل</option></select></div><div class="form-field"><label>ملاحظات</label><input id="debtPaymentNotes" type="text" /></div><div class="modal-actions"><button type="button" id="cancelDebtPaymentBtn" class="btn btn-secondary">إلغاء</button><button class="btn btn-primary">حفظ التسديد</button></div></form></div></div>

  <!-- نافذة إضافة/تعديل عميل -->
  <div id="customerModal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modalTitle">عميل جديد</h2>
      <form id="customerForm">
        <input type="hidden" id="customerId" />
        <div class="form-grid">
          <div class="form-field full">
            <label>الاسم</label>
            <input id="fieldName" type="text" />
          </div>
          <div class="form-field full">
            <label>رقم الهاتف</label>
            <input id="fieldPhone" type="text" />
          </div>
          <div class="form-field full">
            <label>نقاط الولاء</label>
            <input id="fieldPoints" type="text" inputmode="numeric" min="0" value="0" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">إلغاء</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="../common.js"></script>
  <script src="customers.js"></script>
</body>
</html>
