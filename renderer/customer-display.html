<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src 'none';">
  <title>Nexora — Customer display</title>
  <style>
    :root { color-scheme: dark; }
    .skip-link { position: absolute; top: -40px; inset-inline-start: 8px; background: #fff; color: #0f172a; padding: 6px 10px; border-radius: 6px; z-index: 10; }
    .skip-link:focus { top: 8px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc; overflow: hidden;
    }
    .cd-screen { height: 100%; display: flex; flex-direction: column; padding: 4vh 4vw; gap: 3vh; }
    .cd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; }
    .cd-store { font-size: clamp(22px, 2.6vw, 40px); font-weight: 700; letter-spacing: .02em; }
    .cd-brand { font-size: clamp(12px, 1.1vw, 16px); color: #94a3b8; letter-spacing: .18em; text-transform: uppercase; }
    .cd-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .cd-items {
      flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 1vh;
      padding-inline-end: 1vw;
    }
    .cd-item {
      display: flex; justify-content: space-between; align-items: baseline; gap: 2vw;
      padding: 1.2vh 0; border-bottom: 1px solid rgba(148,163,184,.25);
      font-size: clamp(18px, 2.1vw, 32px);
    }
    .cd-item-name { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .cd-item-qty { color: #94a3b8; font-size: .85em; white-space: nowrap; text-align: end; }
    .cd-item-line { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .cd-totals { border-top: 2px solid rgba(148,163,184,.35); padding-top: 2vh; display: flex; flex-direction: column; gap: .8vh; }
    .cd-row { display: flex; justify-content: space-between; color: #cbd5e1; font-size: clamp(16px, 1.6vw, 24px); font-variant-numeric: tabular-nums; }
    .cd-row.cd-strong { color: #f8fafc; font-weight: 700; }
    .cd-grand {
      display: flex; justify-content: space-between; align-items: baseline; gap: 2vw; margin-top: 1.5vh;
      background: rgba(59,130,246,.18); border-radius: 18px; padding: 2.5vh 2.5vw;
    }
    .cd-grand-label { font-size: clamp(20px, 2.2vw, 34px); color: #bfdbfe; font-weight: 600; }
    .cd-grand-value { font-size: clamp(44px, 7vw, 120px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; direction: ltr; }
    .cd-secondary { text-align: end; color: #94a3b8; font-size: clamp(16px, 1.6vw, 24px); margin-top: .6vh; direction: ltr; }
    .cd-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2vh; }
    .cd-hello { font-size: clamp(40px, 6vw, 110px); font-weight: 800; }
    .cd-sub { font-size: clamp(20px, 2.2vw, 36px); color: #cbd5e1; }
    .cd-paid { font-size: clamp(28px, 3.6vw, 60px); font-weight: 700; color: #86efac; direction: ltr; }
    .cd-empty { color: #94a3b8; font-size: clamp(20px, 2.2vw, 34px); }
  </style>
</head>
<body>
  <a href="#mainContent" class="skip-link">Skip to content</a>
  <div id="mainContent" class="cd-screen" aria-live="polite"></div>
  <script src="customer-display.js"></script>
</body>
</html>
