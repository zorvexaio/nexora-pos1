name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — needed so the tagged commit can be mirrored below

      - name: mirror tag + commit to release repo (nexora-pos1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $ErrorActionPreference = "Stop"
          # electron-builder --publish will send this commit's SHA as target_commitish
          # to nexora-pos1. GitHub rejects "Published releases must have a valid tag"
          # if that commit doesn't already exist in nexora-pos1's object database —
          # so we push it there first, to the SAME tag name, before building.
          git push "https://x-access-token:$env:GH_TOKEN@github.com/zorvexaio/nexora-pos1.git" "${{ github.ref_name }}"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install deps
        run: npm ci

      - name: build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: verify release assets were actually uploaded
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $headers = @{ Authorization = "token $env:GH_TOKEN" }
          $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/zorvexaio/nexora-pos1/releases/tags/$tag"
          $names = $release.assets | ForEach-Object { $_.name }
          Write-Host "Uploaded assets: $($names -join ', ')"
          $required = @("Nexora-POS-Setup-$version.exe", "Nexora-POS-Setup-$version.exe.blockmap", "latest.yml")
          $missing = $required | Where-Object { $_ -notin $names }
          if ($missing.Count -gt 0) {
            Write-Error "Release $tag is incomplete — missing: $($missing -join ', '). Auto-update will silently fail until these are all present."
            exit 1
          }
          Write-Host "Release $tag has all required assets. OK."
